<div class="flex flex-col h-screen bg-gray-100">
  <!-- Use the shared Navbar component (without redundant logout handler) -->
  <app-navbar [role]="'Admin'"></app-navbar>

  <!-- Main Content -->
  <div class="flex flex-1 overflow-hidden">
    <!-- Sidebar -->
    <app-sidebar class="hidden md:block flex-shrink-0 h-full"></app-sidebar>

    <!-- Mobile Sidebar Toggle Button (only visible on mobile) -->
    <button 
      class="md:hidden fixed bottom-4 right-4 bg-blue-600 text-white p-3 rounded-full shadow-lg z-20"
      (click)="toggleMobileSidebar()"
    >
      <i class="fas fa-bars"></i>
    </button>

    <!-- Mobile Sidebar (only visible when toggled) -->
    <div *ngIf="showMobileSidebar" class="md:hidden fixed inset-0 bg-gray-600 bg-opacity-75 z-20">
      <div class="absolute inset-0" (click)="closeMobileSidebar()">
        <div class="absolute inset-y-0 left-0 max-w-xs w-full bg-white" (click)="$event.stopPropagation()">
          <button 
            class="absolute top-4 right-4 text-gray-500"
            (click)="closeMobileSidebar()"
          >
            <i class="fas fa-times"></i>
          </button>
          <app-sidebar></app-sidebar>
        </div>
      </div>
    </div>

    <!-- Main Content Area -->
    <div class="flex-1 overflow-auto p-4 md:p-6">
      <router-outlet></router-outlet>
    </div>
  </div>
</div>

<div class="max-w-xl mx-auto bg-white rounded-xl shadow-lg overflow-hidden">
  <div class="bg-gradient-to-r from-blue-600 to-green-500 p-4 text-white">
    <h2 class="text-2xl font-bold text-center flex items-center justify-center">
      <i class="fas fa-truck mr-2"></i>
      Add New Supplier
    </h2>
  </div>

  <form (ngSubmit)="addSupplier()" #supplierForm="ngForm" class="p-6 space-y-5">
    <div class="space-y-4">
      <!-- Name Field -->
      <div class="space-y-2">
        <label class="block text-sm font-medium text-gray-700">Supplier Name</label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
            <i class="fas fa-building text-gray-400"></i>
          </div>
          <input 
            type="text" 
            [(ngModel)]="supplier.name" 
            name="name" 
            required 
            class="w-full pl-10 pr-3 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all" 
            placeholder="Company name"
          />
        </div>
      </div>

      <!-- Email Field -->
      <div class="space-y-2">
        <label class="block text-sm font-medium text-gray-700">Email Address</label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
            <i class="fas fa-envelope text-gray-400"></i>
          </div>
          <input 
            type="email" 
            [(ngModel)]="supplier.email" 
            name="email" 
            required 
            class="w-full pl-10 pr-3 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all" 
            placeholder="supplier@example.com"
          />
        </div>
      </div>

      <!-- Contact Field -->
      <div class="space-y-2">
        <label class="block text-sm font-medium text-gray-700">Contact Number</label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
            <i class="fas fa-phone-alt text-gray-400"></i>
          </div>
          <input 
            type="text" 
            [(ngModel)]="supplier.contact" 
            name="contact" 
            required 
            class="w-full pl-10 pr-3 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all" 
            placeholder="Phone number"
          />
        </div>
      </div>

      <!-- Password Field -->
      <div class="space-y-2">
        <label class="block text-sm font-medium text-gray-700">Password</label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
            <i class="fas fa-lock text-gray-400"></i>
          </div>
          <input 
            type="password" 
            [(ngModel)]="supplier.password" 
            name="password" 
            required 
            class="w-full pl-10 pr-3 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all" 
            placeholder="••••••••"
          />
        </div>
      </div>
    </div>

    <!-- Submit Button -->
    <div class="pt-3">
      <button 
        type="submit" 
        [disabled]="supplierForm.invalid"
        class="w-full bg-gradient-to-r from-blue-600 to-green-500 hover:from-blue-700 hover:to-green-600 text-white font-medium py-2.5 px-4 rounded-lg transition-all shadow-md hover:shadow-lg flex items-center justify-center disabled:opacity-50 disabled:cursor-not-allowed"
      >
        <i class="fas fa-plus-circle mr-2"></i>
        Add Supplier
      </button>
    </div>

    <!-- Messages -->
    <div *ngIf="successMessage" class="bg-green-50 border-l-4 border-green-500 p-4 rounded-md mt-4 flex items-start">
      <i class="fas fa-check-circle text-green-500 mt-0.5 mr-3"></i>
      <span class="text-green-700">{{ successMessage }}</span>
    </div>

    <div *ngIf="errorMessage" class="bg-red-50 border-l-4 border-red-500 p-4 rounded-md mt-4 flex items-start">
      <i class="fas fa-exclamation-circle text-red-500 mt-0.5 mr-3"></i>
      <span class="text-red-700">{{ errorMessage }}</span>
    </div>
  </form>
</div>

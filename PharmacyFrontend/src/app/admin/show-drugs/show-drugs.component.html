<div class="bg-white rounded-xl shadow-lg p-6">
  <div class="flex items-center justify-between mb-6">
    <h2 class="text-2xl font-bold text-gray-800 flex items-center">
      <i class="fas fa-pills text-blue-600 mr-3"></i>
      Medication Inventory
    </h2>
  </div>

  <!-- Messages -->
  <div *ngIf="successMessage" class="bg-green-50 border-l-4 border-green-500 p-4 rounded-md mb-6 flex items-start">
    <i class="fas fa-check-circle text-green-500 mt-0.5 mr-3"></i>
    <span class="text-green-700">{{ successMessage }}</span>
  </div>

  <div *ngIf="errorMessage" class="bg-red-50 border-l-4 border-red-500 p-4 rounded-md mb-6 flex items-start">
    <i class="fas fa-exclamation-circle text-red-500 mt-0.5 mr-3"></i>
    <span class="text-red-700">{{ errorMessage }}</span>
  </div>

  <!-- Drugs Table -->
  <div class="overflow-x-auto rounded-lg border border-gray-200 shadow-sm">
    <table class="min-w-full divide-y divide-gray-200">
      <thead class="bg-gray-50">
        <tr>
          <th scope="col" class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
            Medication
          </th>
          <th scope="col" class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
            Description
          </th>
          <th scope="col" class="px-4 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">
            Price
          </th>
          <th scope="col" class="px-4 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">
            Quantity
          </th>
          <th scope="col" class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
            Expiry
          </th>
          <th scope="col" class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
            Supplier
          </th>
          <th scope="col" class="px-4 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider">
            Actions
          </th>
        </tr>
      </thead>
      <tbody class="bg-white divide-y divide-gray-200">
        <tr *ngFor="let drug of drugs" class="hover:bg-gray-50 transition-colors">
          <td class="px-4 py-3 whitespace-nowrap">
            <div class="font-medium text-gray-900">{{ drug.name }}</div>
          </td>
          <td class="px-4 py-3">
            <div class="text-sm text-gray-500 line-clamp-2">{{ drug.description }}</div>
          </td>
          <td class="px-4 py-3 whitespace-nowrap text-right">
            <div class="text-sm font-medium text-blue-600">₹{{ drug.price }}</div>
          </td>
          <td class="px-4 py-3 whitespace-nowrap text-right">
            <span 
              class="px-2 py-1 text-xs font-medium rounded-full"
              [ngClass]="drug.quantityAvailable > 10 ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'"
            >
              {{ drug.quantityAvailable }}
            </span>
          </td>
          <td class="px-4 py-3 whitespace-nowrap">
            <div class="text-sm text-gray-500">{{ drug.expiryDate | date }}</div>
          </td>
          <td class="px-4 py-3 whitespace-nowrap">
            <div class="text-sm text-gray-500">{{ drug.supplierName }}</div>
          </td>
          <td class="px-4 py-3 whitespace-nowrap text-center">
            <div class="flex justify-center space-x-2">
              <button 
                (click)="editDrug(drug)" 
                class="bg-amber-500 hover:bg-amber-600 text-white p-1.5 rounded-lg transition-colors"
                title="Edit"
              >
                <i class="fas fa-edit"></i>
              </button>
              <button 
                (click)="deleteDrug(drug.id)" 
                class="bg-red-500 hover:bg-red-600 text-white p-1.5 rounded-lg transition-colors"
                title="Delete"
              >
                <i class="fas fa-trash-alt"></i>
              </button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Edit Form -->
  <div *ngIf="selectedDrug" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-xl shadow-xl max-w-2xl w-full max-h-[90vh] overflow-y-auto">
      <div class="bg-gradient-to-r from-blue-600 to-green-500 p-4 text-white rounded-t-xl">
        <h3 class="text-xl font-bold">Edit Medication</h3>
      </div>
      
      <form (ngSubmit)="updateDrug()" class="p-6 space-y-4">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <!-- Name Field -->
          <div class="space-y-2">
            <label class="block text-sm font-medium text-gray-700">Name</label>
            <input 
              type="text" 
              [(ngModel)]="selectedDrug.name" 
              name="name" 
              class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" 
            />
          </div>

          <!-- Price Field -->
          <div class="space-y-2">
            <label class="block text-sm font-medium text-gray-700">Price</label>
            <input 
              type="number" 
              [(ngModel)]="selectedDrug.price" 
              name="price" 
              class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" 
            />
          </div>

          <!-- Quantity Field -->
          <div class="space-y-2">
            <label class="block text-sm font-medium text-gray-700">Quantity</label>
            <input 
              type="number" 
              [(ngModel)]="selectedDrug.quantityAvailable" 
              name="quantity" 
              class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" 
            />
          </div>

          <!-- Expiry Date Field -->
          <div class="space-y-2">
            <label class="block text-sm font-medium text-gray-700">Expiry Date</label>
            <input 
              type="date" 
              [(ngModel)]="selectedDrug.expiryDate" 
              name="expiryDate" 
              class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" 
            />
          </div>

          <!-- Description Field -->
          <div class="space-y-2 md:col-span-2">
            <label class="block text-sm font-medium text-gray-700">Description</label>
            <textarea 
              [(ngModel)]="selectedDrug.description" 
              name="description" 
              rows="3"
              class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" 
            ></textarea>
          </div>
        </div>

        <!-- Action Buttons -->
        <div class="flex justify-end space-x-3 pt-4 border-t">
          <button 
            type="button" 
            (click)="cancelEdit()" 
            class="px-4 py-2 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50 transition-colors"
          >
            Cancel
          </button>
          <button 
            type="submit" 
            class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg transition-colors"
          >
            Save Changes
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

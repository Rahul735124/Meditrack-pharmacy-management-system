<div class="bg-white rounded-xl shadow-lg p-6">
  <div class="flex items-center justify-between mb-6">
    <h2 class="text-2xl font-bold text-gray-800 flex items-center">
      <i class="fas fa-truck text-blue-600 mr-3"></i>
      Supplier Directory
    </h2>
  </div>

  <!-- Suppliers Table -->
  <div class="overflow-x-auto rounded-lg border border-gray-200 shadow-sm">
    <table class="min-w-full divide-y divide-gray-200">
      <thead class="bg-gray-50">
        <tr>
          <th scope="col" class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
            Name
          </th>
          <th scope="col" class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
            Email
          </th>
          <th scope="col" class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
            Contact
          </th>
          <th scope="col" class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
            Password
          </th>
          <th scope="col" class="px-4 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider">
            Actions
          </th>
        </tr>
      </thead>
      <tbody class="bg-white divide-y divide-gray-200">
        <tr *ngFor="let supplier of suppliers" class="hover:bg-gray-50 transition-colors">
          <!-- View Mode -->
          <ng-container *ngIf="editingSupplierId !== supplier.id; else editMode">
            <td class="px-4 py-3 whitespace-nowrap">
              <div class="font-medium text-gray-900">{{ supplier.name }}</div>
            </td>
            <td class="px-4 py-3 whitespace-nowrap">
              <div class="text-sm text-gray-500">{{ supplier.email }}</div>
            </td>
            <td class="px-4 py-3 whitespace-nowrap">
              <div class="text-sm text-gray-500">{{ supplier.contact }}</div>
            </td>
            <td class="px-4 py-3 whitespace-nowrap">
              <div class="text-sm text-gray-500">•••••••••</div>
            </td>
            <td class="px-4 py-3 whitespace-nowrap text-center">
              <div class="flex justify-center space-x-2">
                <button 
                  (click)="startEdit(supplier)" 
                  class="bg-amber-500 hover:bg-amber-600 text-white p-1.5 rounded-lg transition-colors"
                  title="Edit"
                >
                  <i class="fas fa-edit"></i>
                </button>
                <button 
                  (click)="deleteSupplier(supplier.id)" 
                  class="bg-red-500 hover:bg-red-600 text-white p-1.5 rounded-lg transition-colors"
                  title="Delete"
                >
                  <i class="fas fa-trash-alt"></i>
                </button>
              </div>
            </td>
          </ng-container>

          <!-- Edit Mode -->
          <ng-template #editMode>
            <td class="px-4 py-3 whitespace-nowrap">
              <input 
                [(ngModel)]="editableSupplier.name" 
                class="w-full px-3 py-1.5 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 focus:border-blue-500" 
              />
            </td>
            <td class="px-4 py-3 whitespace-nowrap">
              <input 
                [(ngModel)]="editableSupplier.email" 
                class="w-full px-3 py-1.5 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 focus:border-blue-500" 
              />
            </td>
            <td class="px-4 py-3 whitespace-nowrap">
              <input 
                [(ngModel)]="editableSupplier.contact" 
                class="w-full px-3 py-1.5 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 focus:border-blue-500" 
              />
            </td>
            <td class="px-4 py-3 whitespace-nowrap">
              <input 
                [(ngModel)]="editableSupplier.password" 
                type="password"
                class="w-full px-3 py-1.5 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 focus:border-blue-500" 
              />
            </td>
            <td class="px-4 py-3 whitespace-nowrap text-center">
              <div class="flex justify-center space-x-2">
                <button 
                  (click)="saveUpdate(supplier.id)" 
                  class="bg-green-600 hover:bg-green-700 text-white p-1.5 rounded-lg transition-colors"
                  title="Save"
                >
                  <i class="fas fa-save"></i>
                </button>
                <button 
                  (click)="cancelEdit()" 
                  class="bg-gray-500 hover:bg-gray-600 text-white p-1.5 rounded-lg transition-colors"
                  title="Cancel"
                >
                  <i class="fas fa-times"></i>
                </button>
              </div>
            </td>
          </ng-template>
        </tr>
      </tbody>
    </table>
  </div>
</div>

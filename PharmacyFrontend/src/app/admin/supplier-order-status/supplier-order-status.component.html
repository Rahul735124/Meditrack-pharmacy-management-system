<div class="bg-white rounded-xl shadow-lg p-6">
  <div class="flex items-center justify-between mb-6">
    <h2 class="text-2xl font-bold text-gray-800 flex items-center">
      <i class="fas fa-truck-loading text-blue-600 mr-3"></i>
      Supplier Order Status
    </h2>
  </div>

  <!-- Loading State -->
  <div *ngIf="loading" class="flex justify-center items-center py-12">
    <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600"></div>
  </div>

  <!-- Error Message -->
  <div *ngIf="error" class="bg-red-50 border-l-4 border-red-500 p-4 rounded-md mb-6 flex items-start">
    <i class="fas fa-exclamation-circle text-red-500 mt-0.5 mr-3"></i>
    <span class="text-red-700">{{ error }}</span>
  </div>

  <!-- Empty State -->
  <div *ngIf="!loading && supplierOrders.length === 0" class="bg-gray-50 rounded-lg p-8 text-center">
    <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-blue-50 mb-4">
      <i class="fas fa-truck text-blue-500 text-2xl"></i>
    </div>
    <h3 class="text-lg font-medium text-gray-900 mb-1">No supplier orders</h3>
    <p class="text-gray-500">There are no pending supplier orders at this time</p>
  </div>

  <!-- Orders Table -->
  <div *ngIf="!loading && supplierOrders.length > 0" class="overflow-x-auto rounded-lg border border-gray-200 shadow-sm">
    <table class="min-w-full divide-y divide-gray-200">
      <thead class="bg-gray-50">
        <tr>
          <th scope="col" class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
            Medication
          </th>
          <th scope="col" class="px-4 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider">
            Quantity
          </th>
          <th scope="col" class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
            Order Date
          </th>
          <th scope="col" class="px-4 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider">
            Status
          </th>
        </tr>
      </thead>
      <tbody class="bg-white divide-y divide-gray-200">
        <tr *ngFor="let item of supplierOrders" class="hover:bg-gray-50 transition-colors">
          <td class="px-4 py-3">
            <div class="flex items-center">
              <div class="flex-shrink-0 h-10 w-10 bg-blue-100 rounded-full flex items-center justify-center">
                <i class="fas fa-pills text-blue-500"></i>
              </div>
              <div class="ml-4">
                <div class="font-medium text-gray-900">{{ item.drugName }}</div>
              </div>
            </div>
          </td>
          <td class="px-4 py-3 text-center">
            <span class="px-3 py-1 inline-flex text-sm leading-5 font-medium rounded-full bg-blue-100 text-blue-800">
              {{ item.quantity }}
            </span>
          </td>
          <td class="px-4 py-3 whitespace-nowrap">
            <div class="text-sm text-gray-500">{{ item.orderDate | date: 'mediumDate' }}</div>
          </td>
          <td class="px-4 py-3 text-center">
            <span
              class="px-3 py-1 inline-flex text-sm leading-5 font-medium rounded-full"
              [ngClass]="{
                'bg-green-100 text-green-800': item.status === 'Confirmed',
                'bg-yellow-100 text-yellow-800': item.status === 'Requested'
              }"
            >
              <i 
                class="mr-1"
                [ngClass]="{
                  'fas fa-check-circle': item.status === 'Confirmed',
                  'fas fa-clock': item.status === 'Requested'
                }"
              ></i>
              {{ item.status }}
            </span>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

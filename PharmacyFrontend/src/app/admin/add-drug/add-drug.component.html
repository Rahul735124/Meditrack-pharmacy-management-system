<div class="max-w-xl mx-auto bg-white rounded-xl shadow-lg overflow-hidden">
  <div class="bg-gradient-to-r from-blue-600 to-green-500 p-4 text-white">
    <h2 class="text-2xl font-bold text-center flex items-center justify-center">
      <i class="fas fa-prescription-bottle-alt mr-2"></i>
      Add New Medication
    </h2>
  </div>

  <form (ngSubmit)="onSubmit()" #drugForm="ngForm" class="p-6 space-y-5">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
      <!-- Name Field -->
      <div class="space-y-2">
        <label class="block text-sm font-medium text-gray-700">Medication Name</label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
            <i class="fas fa-pills text-gray-400"></i>
          </div>
          <input type="text" [(ngModel)]="drug.name" name="name" required
            class="w-full pl-10 pr-3 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all"
            placeholder="Enter medication name" />
        </div>
      </div>

      <!-- Price Field -->
      <div class="space-y-2">
        <label class="block text-sm font-medium text-gray-700">Price (₹)</label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
            <i class="fas fa-tag text-gray-400"></i>
          </div>
          <input type="number" [(ngModel)]="drug.price" name="price" required
            class="w-full pl-10 pr-3 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all"
            placeholder="0.00" />
        </div>
      </div>

      <!-- Quantity Field -->
      <div class="space-y-2">
        <label class="block text-sm font-medium text-gray-700">Quantity in Stock</label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
            <i class="fas fa-cubes text-gray-400"></i>
          </div>
          <input type="number" [(ngModel)]="drug.quantity" name="quantity" required
            class="w-full pl-10 pr-3 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all"
            placeholder="0" />
        </div>
      </div>

      <!-- Expiry Date Field -->
      <div class="space-y-2">
        <label class="block text-sm font-medium text-gray-700">Expiry Date</label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
            <i class="fas fa-calendar-alt text-gray-400"></i>
          </div>
          <input type="date" [(ngModel)]="drug.expiryDate" name="expiryDate" required
            class="w-full pl-10 pr-3 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all" />
        </div>
      </div>

      <!-- Supplier ID Field -->
      <div class="space-y-2 md:col-span-2">
        <label class="block text-sm font-medium text-gray-700">Supplier</label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
            <i class="fas fa-truck text-gray-400"></i>
          </div>
          <select [(ngModel)]="drug.supplierId" name="supplierId" required
            class="w-full pl-10 pr-3 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all">
            <option *ngFor="let supplier of suppliers" [value]="supplier.id">
              {{ supplier.name }}
            </option>
          </select>

        </div>
      </div>

      <!-- Description Field -->
      <div class="space-y-2 md:col-span-2">
        <label class="block text-sm font-medium text-gray-700">Description</label>
        <div class="relative">
          <div class="absolute top-3 left-3 pointer-events-none">
            <i class="fas fa-file-medical-alt text-gray-400"></i>
          </div>
          <textarea [(ngModel)]="drug.description" name="description" required rows="3"
            class="w-full pl-10 pr-3 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all"
            placeholder="Enter medication description, uses, and side effects"></textarea>
        </div>
      </div>
    </div>

    <!-- Submit Button -->
    <div class="pt-3">
      <button type="submit" [disabled]="drugForm.invalid"
        class="w-full bg-gradient-to-r from-blue-600 to-green-500 hover:from-blue-700 hover:to-green-600 text-white font-medium py-2.5 px-4 rounded-lg transition-all shadow-md hover:shadow-lg flex items-center justify-center disabled:opacity-50 disabled:cursor-not-allowed">
        <i class="fas fa-plus-circle mr-2"></i>
        Add Medication
      </button>
    </div>

    <!-- Messages -->
    <div *ngIf="successMessage" class="bg-green-50 border-l-4 border-green-500 p-4 rounded-md mt-4 flex items-start">
      <i class="fas fa-check-circle text-green-500 mt-0.5 mr-3"></i>
      <span class="text-green-700">{{ successMessage }}</span>
    </div>

    <div *ngIf="errorMessage" class="bg-red-50 border-l-4 border-red-500 p-4 rounded-md mt-4 flex items-start">
      <i class="fas fa-exclamation-circle text-red-500 mt-0.5 mr-3"></i>
      <span class="text-red-700">{{ errorMessage }}</span>
    </div>
  </form>
</div>

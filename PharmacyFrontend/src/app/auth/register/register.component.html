<!-- register.component.html -->
<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-50 to-green-50 p-4">
  <div class="w-full max-w-md">
    <!-- Card Container -->
    <div class="bg-white rounded-2xl shadow-xl overflow-hidden border border-gray-100">
      <!-- Header with Pharmacy Logo -->
      <div class="bg-gradient-to-r from-blue-600 to-green-500 p-6 text-white text-center">
        <div class="flex justify-center mb-3">
          <div class="bg-white p-3 rounded-full">
            <i class="fas fa-prescription-bottle-alt text-green-500 text-3xl"></i>
          </div>
        </div>
        <h2 class="text-2xl font-bold">MediTrack</h2>
        <p class="text-blue-100 text-sm">Pharmacy Management System</p>
      </div>

      <!-- Register Form -->
      <div class="p-8">
        <h3 class="text-xl font-semibold text-gray-800 mb-6 text-center">Create Your Account</h3>

        <form [formGroup]="registerForm" (ngSubmit)="register()" class="space-y-4">
          <!-- Name Field -->
          <div class="space-y-2">
            <label for="name" class="block text-sm font-medium text-gray-700">Full Name</label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                <i class="fas fa-user text-gray-400"></i>
              </div>
              <input 
                type="text" 
                id="name" 
                formControlName="name"
                placeholder="John Doe"
                class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500 transition-all"
              />
            </div>
            <div *ngIf="registerForm.get('name')?.touched && registerForm.get('name')?.invalid" class="text-red-500 text-xs mt-1 flex items-center">
              <i class="fas fa-exclamation-circle mr-1"></i>
              Name is required
            </div>
          </div>

          <!-- Email Field -->
          <div class="space-y-2">
            <label for="email" class="block text-sm font-medium text-gray-700">Email Address</label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                <i class="fas fa-envelope text-gray-400"></i>
              </div>
              <input 
                type="email" 
                id="email" 
                formControlName="email"
                placeholder="you@example.com"
                class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500 transition-all"
              />
            </div>
            <div *ngIf="registerForm.get('email')?.touched && registerForm.get('email')?.invalid" class="text-red-500 text-xs mt-1 flex items-center">
              <i class="fas fa-exclamation-circle mr-1"></i>
              <span *ngIf="registerForm.get('email')?.errors?.['required']">Email is required</span>
              <span *ngIf="registerForm.get('email')?.errors?.['email']">Enter a valid email</span>
            </div>
          </div>

          <!-- Contact Field -->
          <div class="space-y-2">
            <label for="contact" class="block text-sm font-medium text-gray-700">Contact Number</label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                <i class="fas fa-phone-alt text-gray-400"></i>
              </div>
              <input 
                type="text" 
                id="contact" 
                formControlName="contact"
                placeholder="(123) 456-7890"
                class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500 transition-all"
              />
            </div>
            <div *ngIf="registerForm.get('contact')?.touched && registerForm.get('contact')?.invalid" class="text-red-500 text-xs mt-1 flex items-center">
              <i class="fas fa-exclamation-circle mr-1"></i>
              Contact number is required
            </div>
          </div>

          <!-- Password Field -->
          <div class="space-y-2">
            <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                <i class="fas fa-lock text-gray-400"></i>
              </div>
              <input 
                [type]="showPassword ? 'text' : 'password'" 
                id="password" 
                formControlName="password"
                placeholder="••••••••"
                class="w-full pl-10 pr-12 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500 transition-all"
              />
              <button 
                type="button" 
                (click)="togglePassword('password')"
                class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-500 hover:text-gray-700"
              >
                <i class="fas" [ngClass]="showPassword ? 'fa-eye-slash' : 'fa-eye'"></i>
              </button>
            </div>
          </div>

          <!-- Confirm Password Field -->
          <div class="space-y-2">
            <label for="confirmPassword" class="block text-sm font-medium text-gray-700">Confirm Password</label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                <i class="fas fa-lock text-gray-400"></i>
              </div>
              <input 
                [type]="showConfirmPassword ? 'text' : 'password'" 
                id="confirmPassword" 
                formControlName="confirmPassword"
                placeholder="••••••••"
                class="w-full pl-10 pr-12 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500 transition-all"
              />
              <button 
                type="button" 
                (click)="togglePassword('confirmPassword')"
                class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-500 hover:text-gray-700"
              >
                <i class="fas" [ngClass]="showConfirmPassword ? 'fa-eye-slash' : 'fa-eye'"></i>
              </button>
            </div>
          </div>

          <!-- Messages -->
          <div *ngIf="errorMessage" class="bg-red-50 text-red-600 p-3 rounded-lg text-sm flex items-start">
            <i class="fas fa-exclamation-circle mt-0.5 mr-2"></i>
            <span>{{ errorMessage }}</span>
          </div>

          <div *ngIf="successMessage" class="bg-green-50 text-green-600 p-3 rounded-lg text-sm flex items-start">
            <i class="fas fa-check-circle mt-0.5 mr-2"></i>
            <span>{{ successMessage }}</span>
          </div>

          <!-- Register Button -->
          <button 
            type="submit"
            class="w-full bg-gradient-to-r from-blue-600 to-green-500 hover:from-blue-700 hover:to-green-600 text-white font-medium py-3 px-4 rounded-lg transition-all shadow-md hover:shadow-lg flex items-center justify-center mt-6"
          >
            <i class="fas fa-user-plus mr-2"></i>
            Create Account
          </button>

          <!-- Login Link -->
          <div class="text-center mt-4">
            <p class="text-gray-600 text-sm">
              Already have an account?
              <a [routerLink]="['/auth/login']" class="text-green-600 hover:text-green-800 font-medium ml-1">
                Sign In
              </a>
            </p>
          </div>
        </form>
      </div>
    </div>

    <!-- Footer -->
    <div class="text-center mt-6 text-gray-500 text-xs">
      <p>© 2025 MediTrack Pharmacy Management. All rights reserved.</p>
    </div>
  </div>
</div>

<!-- reset-password.component.html -->
<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-50 to-green-50 p-4">
  <div class="w-full max-w-md">
    <!-- Card Container -->
    <div class="bg-white rounded-2xl shadow-xl overflow-hidden border border-gray-100">
      <!-- Header with Pharmacy Logo -->
      <div class="bg-gradient-to-r from-blue-600 to-green-500 p-6 text-white text-center">
        <div class="flex justify-center mb-3">
          <div class="bg-white p-3 rounded-full">
            <i class="fas fa-prescription-bottle-alt text-green-500 text-3xl"></i>
          </div>
        </div>
        <h2 class="text-2xl font-bold">MediTrack</h2>
        <p class="text-blue-100 text-sm">Pharmacy Management System</p>
      </div>

      <!-- Reset Password Form -->
      <div class="p-8">
        <h3 class="text-xl font-semibold text-gray-800 mb-2 text-center">Reset Your Password</h3>
        <p class="text-gray-500 text-sm text-center mb-6">Create a new password for your account</p>

        <form [formGroup]="resetPasswordForm" (ngSubmit)="resetPassword()" class="space-y-5">
          <!-- New Password Field -->
          <div class="space-y-2">
            <label for="newPassword" class="block text-sm font-medium text-gray-700">New Password</label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                <i class="fas fa-lock text-gray-400"></i>
              </div>
              <input 
                type="password" 
                id="newPassword" 
                formControlName="newPassword"
                placeholder="••••••••"
                class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500 transition-all"
              />
            </div>
          </div>

          <!-- Confirm Password Field -->
          <div class="space-y-2">
            <label for="confirmPassword" class="block text-sm font-medium text-gray-700">Confirm Password</label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                <i class="fas fa-lock text-gray-400"></i>
              </div>
              <input 
                type="password" 
                id="confirmPassword" 
                formControlName="confirmPassword"
                placeholder="••••••••"
                class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500 transition-all"
              />
            </div>
          </div>

          <!-- Message -->
          <div *ngIf="message" class="bg-blue-50 text-blue-600 p-3 rounded-lg text-sm flex items-start">
            <i class="fas fa-info-circle mt-0.5 mr-2"></i>
            <span>{{ message }}</span>
          </div>

          <!-- Submit Button -->
          <button 
            type="submit"
            class="w-full bg-gradient-to-r from-blue-600 to-green-500 hover:from-blue-700 hover:to-green-600 text-white font-medium py-3 px-4 rounded-lg transition-all shadow-md hover:shadow-lg flex items-center justify-center"
          >
            <i class="fas fa-key mr-2"></i>
            Reset Password
          </button>

          <!-- Back to Login -->
          <div class="text-center mt-6">
            <p class="text-gray-600 text-sm">
              <a [routerLink]="['/auth/login']" class="text-green-600 hover:text-green-800 font-medium">
                Back to Sign In
              </a>
            </p>
          </div>
        </form>
      </div>
    </div>

    <!-- Footer -->
    <div class="text-center mt-6 text-gray-500 text-xs">
      <p>© 2025 MediTrack Pharmacy Management. All rights reserved.</p>
    </div>
  </div>
</div>

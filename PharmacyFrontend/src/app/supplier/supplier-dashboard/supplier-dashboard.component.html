<div class="bg-gray-50 p-6 md:p-10 rounded-lg">
  <h2 class="text-2xl font-bold text-gray-800 mb-6 flex items-center">
    <i class="fas fa-truck text-blue-600 mr-3"></i>
    Supplier Dashboard
  </h2>

  <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
    <!-- New Orders Card -->
    <div 
      class="bg-white border border-gray-200 rounded-xl shadow-sm overflow-hidden hover:shadow-md transition duration-300 group cursor-pointer"
      [routerLink]="['/dashboard/supplier/order-request']"
    >
      <div class="p-6">
        <div class="flex items-center justify-between mb-4">
          <div class="bg-blue-100 p-3 rounded-full">
            <i class="fas fa-clipboard-list text-blue-600 text-xl"></i>
          </div>
          <span class="bg-blue-100 text-blue-700 text-xs font-medium px-2.5 py-1 rounded-full">New</span>
        </div>
        
        <h3 class="text-lg font-semibold text-gray-800 mb-1 group-hover:text-blue-600 transition">New Orders</h3>
        
        
        <div class="flex items-center text-sm text-gray-500 mt-3">
          <i class="fas fa-mouse-pointer mr-2 opacity-70"></i>
          <p>Click to view and approve</p>
        </div>
      </div>
      
      <div class="bg-gradient-to-r from-blue-50 to-blue-100 px-6 py-3 border-t border-gray-200">
        <div class="flex justify-between items-center">
          <span class="text-sm text-blue-600 font-medium">View Details</span>
          <i class="fas fa-arrow-right text-blue-600 group-hover:translate-x-1 transition-transform"></i>
        </div>
      </div>
    </div>
        
  </div>
</div>

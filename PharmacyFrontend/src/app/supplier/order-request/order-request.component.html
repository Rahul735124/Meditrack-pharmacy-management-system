<div class="bg-gray-50 p-6 rounded-lg">
  <!-- Header with title and close button -->
  <div class="flex justify-between items-center mb-6">
    <h2 class="text-2xl font-bold text-gray-800 flex items-center">
      <i class="fas fa-clipboard-list text-blue-600 mr-3"></i>
      Pending Order Requests
    </h2>
    
    <button
      (click)="exitOrderRequest()"
      class="flex items-center gap-2 px-4 py-2 bg-white border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-100 transition shadow-sm"
    >
      <i class="fas fa-arrow-left"></i>
      Back to Dashboard
    </button>
  </div>

  <!-- Order cards -->
  <div *ngIf="orders.length > 0; else noOrders">
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <div
        *ngFor="let order of orders"
        class="bg-white border border-gray-200 rounded-xl shadow-sm overflow-hidden hover:shadow-md transition"
      >
        <!-- Card Header -->
        <div class="bg-gradient-to-r from-blue-50 to-blue-100 px-5 py-3 border-b border-gray-200">
          <div class="flex justify-between items-center">
            <span class="font-medium text-blue-700">Order Request</span>
            <span class="bg-yellow-100 text-yellow-800 text-xs font-medium px-2.5 py-1 rounded-full">
              Pending
            </span>
          </div>
        </div>
        
        <!-- Card Content -->
        <div class="p-5">
          <div class="flex items-start mb-4">
            <div class="bg-blue-100 p-2 rounded-full mr-3">
              <i class="fas fa-pills text-blue-600"></i>
            </div>
            <div>
              <h3 class="text-lg font-semibold text-gray-800">
                {{ order.drugName }}
              </h3>
              <p class="text-sm text-gray-500">Order ID: #{{ order.orderItemId }}</p>
            </div>
          </div>
          
          <div class="bg-gray-50 rounded-lg p-3 mb-4">
            <div class="flex justify-between items-center">
              <span class="text-gray-600 text-sm">Quantity:</span>
              <span class="font-bold text-gray-800 bg-blue-100 px-3 py-1 rounded-full">
                {{ order.quantity }}
              </span>
            </div>
          </div>
          
          <button
            (click)="confirmAndSend(order.orderItemId)"
            class="w-full px-4 py-3 bg-green-600 text-white rounded-lg hover:bg-green-700 transition flex items-center justify-center gap-2"
          >
            <i class="fas fa-check-circle"></i>
            Confirm & Send
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Enhanced No orders message -->
  <ng-template #noOrders>
    <div class="bg-white border border-gray-200 rounded-xl p-10 text-center shadow-sm">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-blue-50 mb-4">
        <i class="fas fa-clipboard-check text-blue-500 text-2xl"></i>
      </div>
      <h3 class="text-xl font-medium text-gray-800 mb-2">No Pending Orders</h3>
      <p class="text-gray-500 max-w-md mx-auto">
        There are no pending order requests at this time. New requests will appear here when pharmacies need medications.
      </p>
      <button
        (click)="exitOrderRequest()"
        class="mt-6 px-5 py-2.5 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition inline-flex items-center gap-2"
      >
        <i class="fas fa-arrow-left"></i>
        Return to Dashboard
      </button>
    </div>
  </ng-template>
</div>

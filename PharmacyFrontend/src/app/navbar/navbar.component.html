<!-- navbar.component.html -->
<nav class="bg-gradient-to-r from-blue-700 to-blue-600 text-white p-4 shadow-lg">
  <div class="max-w-7xl mx-auto flex justify-between items-center">
    <!-- Welcome Message -->
    <div class="text-xl font-semibold flex items-center">
      <i class="fas fa-hospital-user mr-2"></i>
      Welcome <strong class="ml-1">{{ role | titlecase }}</strong>
    </div>

    <!-- Search Bar - Only for Doctor role -->
    <div *ngIf="role === 'Doctor'" class="w-64 mx-auto">
      <div class="relative">
        <input 
          type="text" 
          [(ngModel)]="searchQuery" 
          (keyup.enter)="onSearch()" 
          placeholder="Search medications..." 
          class="bg-white/90 w-full px-3 py-2 rounded-md border border-blue-300 text-gray-800 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-400 focus:bg-white transition-all"
        />
        <button 
          (click)="onSearch()" 
          class="absolute right-2 top-1/2 transform -translate-y-1/2 text-blue-500 hover:text-blue-700 transition-colors"
        >
          <i class="fas fa-search"></i>
        </button>
      </div>
    </div>

    <!-- User Profile Dropdown -->
    <div class="relative" (click)="toggleDropdown()" (blur)="closeDropdown()" tabindex="0">
      <button class="flex items-center gap-2 focus:outline-none bg-blue-800/30 hover:bg-blue-800/50 transition-colors rounded-full px-3 py-1.5">
        <img 
          src="assets/images/user.png" 
          alt="Profile"
          class="w-8 h-8 rounded-full border-2 border-white hover:border-blue-200 transition duration-200" 
        />
        <span class="hidden sm:inline">My Account</span>
        <i class="fas fa-chevron-down text-xs transition-transform" [class.rotate-180]="dropdownOpen"></i>
      </button>

      <!-- Dropdown Menu -->
      <div *ngIf="dropdownOpen" class="absolute right-0 mt-2 w-48 bg-white text-gray-800 rounded-lg shadow-xl z-20 overflow-hidden animate-fadeIn">
        <ng-container *ngIf="role === 'Doctor'">
          <a routerLink="/dashboard/doctor/profile" class="flex items-center px-4 py-3 hover:bg-gray-100 transition">
            <i class="fas fa-user-md mr-2 text-blue-600"></i>
            <span>Doctor Profile</span>
          </a>
        </ng-container>
        <button class="flex items-center w-full text-left px-4 py-3 hover:bg-gray-100 transition border-t border-gray-100" (click)="logout()">
          <i class="fas fa-sign-out-alt mr-2 text-red-500"></i>
          <span>Logout</span>
        </button>
      </div>
    </div>
  </div>
</nav>

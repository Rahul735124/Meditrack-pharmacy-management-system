<div class="bg-white shadow-lg rounded-xl p-5 hover:shadow-2xl transition-shadow duration-300 flex flex-col h-full border border-gray-200">
  
  <!-- Drug Image -->
  <div class="flex justify-center mb-4">
    <img 
      src="assets/images/drug.jpg" 
      alt="Drug Image" 
      class="w-36 h-36 object-cover rounded-lg shadow-md transition-transform duration-300 hover:scale-105"
    >
  </div>

  <!-- Drug Info -->
  <h2 class="text-lg font-bold text-gray-900 mb-1 truncate">{{ drug.name }}</h2>
  <p class="text-gray-600 text-sm mb-2 line-clamp-2">{{ drug.description }}</p>

  <div class="flex justify-between items-center mb-3">
    <p class="text-blue-600 font-bold text-lg">₹{{ drug.price }}</p>
    <span class="text-xs bg-blue-100 text-blue-700 px-2 py-1 rounded-lg shadow-sm">
      <i class="fas fa-calendar-alt mr-1"></i>
      Expires: {{ drug.expiryDate | date:'mediumDate' }}
    </span>
  </div>

  <!-- Quantity & Add to Cart -->
  <div class="mt-auto pt-3 border-t border-gray-200">
    <div class="flex items-center space-x-3">
      
      <!-- Quantity Selector -->
      <div class="flex flex-1 items-center border rounded-lg shadow-sm bg-gray-50 overflow-hidden">
        <button 
          type="button" 
          (click)="decrementQuantity()" 
          class="bg-gray-200 px-3 py-2 text-gray-600 hover:bg-gray-300 transition"
        >
          <i class="fas fa-minus"></i>
        </button>
        <input 
          type="number" 
          [(ngModel)]="quantity" 
          min="1" 
          placeholder="1" 
          class="border-none text-center w-full bg-transparent text-gray-900 font-medium focus:ring-0 focus:outline-none"
        >
        <button 
          type="button" 
          (click)="incrementQuantity()" 
          class="bg-gray-200 px-3 py-2 text-gray-600 hover:bg-gray-300 transition"
        >
          <i class="fas fa-plus"></i>
        </button>
      </div>

      <!-- Add Button -->
      <button 
        [disabled]="quantity <= 0 || quantity === null || quantity === undefined" 
        (click)="addToCart()"
        class="bg-blue-500 text-white px-4 py-2 rounded-lg shadow-md hover:bg-blue-600 hover:shadow-lg transition-all disabled:opacity-50 disabled:cursor-not-allowed flex items-center gap-2"
      >
        <i class="fas fa-cart-plus"></i>
        Add
      </button>

    </div>
  </div>

</div>
